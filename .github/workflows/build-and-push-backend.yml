name: Build and publish backend Docker image to GHCR

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image tags
        run: |
          repo_full="$GITHUB_REPOSITORY"
          owner=$(echo "$repo_full" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          repo=$(echo "$repo_full" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG1=ghcr.io/${owner}/${repo}-backend:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_TAG2=ghcr.io/${owner}/${repo}-backend:latest" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_TAG1 }}
            ${{ env.IMAGE_TAG2 }}
